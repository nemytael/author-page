  <style>
    :root { --ink:#2a2140; --muted:#7d6f94; --paper:#f5f3f9; --line:#e6e0ef; --magenta:#D468D2; --violet:#756DF2; --rose-deep:#b53fae;
            --grad: linear-gradient(90deg, #756DF2 0%, #A56BE2 50%, #D468D2 100%); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Nunito",sans-serif; font-weight:300; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; }
    .band { height:6px; background:var(--grad); }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:24px; padding:56px 48px; max-width:520px; width:100%; text-align:center; box-shadow:0 24px 60px rgba(117,109,242,.12); position:relative; overflow:hidden; }
    .card::before { content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--grad); }
    .card img { height:64px; margin-bottom:18px; }
    .heart { font-size:2.6rem; color:var(--magenta); display:block; margin-bottom:6px; animation:beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%,100%{transform:scale(1)} 30%{transform:scale(1.15)} 45%{transform:scale(1)} 60%{transform:scale(1.1)} }
    h1 { font-family:"Great Vibes",cursive; font-weight:400; font-size:3.4rem; line-height:1.1; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { margin:16px 0 30px; color:var(--muted); font-size:1.05rem; line-height:1.7; }
    .btn { display:inline-block; padding:12px 28px; border-radius:999px; font-weight:600; font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; color:#fff; text-decoration:none;
            background:linear-gradient(90deg,var(--magenta),var(--violet)); background-size:200% 100%; box-shadow:0 8px 20px rgba(117,109,242,.35); transition:background-position .4s, transform .2s; }
    .btn:hover { background-position:100% 0; transform:translateY(-2px); }
    .small { margin:22px 0 0; font-size:.85rem; }
    .small a { color:var(--rose-deep); text-decoration:none; }
    footer { text-align:center; padding:24px; font-size:.8rem; color:var(--muted); }
  </style>
</head>
